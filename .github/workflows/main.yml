name: Remote PC

on:
  workflow_dispatch:

jobs:
  pc:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TS_AUTHKEY }} --hostname=gh-pc

      - name: Install desktop + xrdp
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 xfce4-goodies dbus-x11 xrdp xorgxrdp

      - name: Bikin user
        run: |
          sudo useradd -m -s /bin/bash kaka
          echo "kaka:${{ secrets.RDP_PASSWORD }}" | sudo chpasswd
          sudo usermod -aG sudo kaka

      - name: Setting sesi xrdp
        run: |
          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh
          exec > /tmp/startwm.log 2>&1
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          export XDG_CONFIG_DIRS=/etc/xdg
          export XDG_CURRENT_DESKTOP=XFCE
          exec dbus-launch --exit-with-session startxfce4
          EOF
          sudo chmod +x /etc/xrdp/startwm.sh
          sudo adduser xrdp ssl-cert
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: Cek instalasi
        run: |
          which startxfce4 xfce4-session dbus-launch
          dpkg -l | grep -E "xfce4-session|xfconf|xorgxrdp"
          sudo systemctl status xrdp --no-pager

      - name: Tampilin IP & nahan VM
        run: |
          set +e
          tailscale ip -4
          for i in $(seq 1 700); do
            sleep 30
            echo "=== $(date +%T) ==="
            sudo tail -n 15 /var/log/xrdp-sesman.log
            cat /tmp/startwm.log 2>/dev/null | tail -n 30
            sudo tail -n 30 /home/kaka/.xsession-errors 2>/dev/null
          done
